<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Signup</title>

<style>
    body {
        font-family: Arial, sans-serif;
        background: linear-gradient(135deg, #ff7e5f, #feb47b);
        height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
    }

    .signup-container {
        background: white;
        padding: 40px;
        border-radius: 12px;
        box-shadow: 0 10px 30px rgba(0,0,0,0.1);
        width: 350px;
        text-align: center;
    }

    h2 {
        margin-bottom: 20px;
        color: #333;
    }

    form p {
        text-align: left;
        margin-bottom: 15px;
    }

    input {
        width: 100%;
        padding: 10px;
        border: 1px solid #ccc;
        border-radius: 8px;
        margin-top: 5px;
        font-size: 14px;
    }

    input:focus {
        border-color: #ff7e5f;
        outline: none;
    }

    button {
        width: 100%;
        padding: 12px;
        background: #ff7e5f;
        color: white;
        border: none;
        border-radius: 8px;
        font-size: 16px;
        cursor: pointer;
        margin-top: 10px;
        transition: 0.3s;
    }

    button:hover {
        background: #e96b4d;
    }

    a {
        display: block;
        margin-top: 15px;
        text-decoration: none;
        color: #ff7e5f;
        font-size: 14px;
    }

    a:hover {
        text-decoration: underline;
    }
</style>
</head>

<body>

<div class="signup-container">
    <h2>Signup</h2>

    <form method="POST">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">Signup</button>
    </form>

    <a href="{% url 'login' %}">Already have an account? Login</a>
</div>

</body>
</html>
