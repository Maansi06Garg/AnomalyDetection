
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Temperature Anomaly Detector</title>

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #b3c5e8;
            padding: 30px;

            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            width: 100%;
            max-width: 1800px;
            margin: 0 auto;
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 25px;
            align-items: stretch;
        }

        .card {
            background: white;
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 8px 25px rgba(0,0,0,0.08);
        }

        h1, h2 {
            color: #333;
            margin-bottom: 20px;
        }

        button {
            padding: 12px 24px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
            transition: 0.3s;
        }

        .start-btn {
            background: #28a745;
            color: white;
        }

        .stop-btn {
            background: #dc3545;
            color: white;
        }

        .info-box {
            background: #f8f9fa;
            padding: 15px;
            border-radius: 10px;
            margin-top: 20px;
        }

        .info-box p {
            margin-bottom: 10px;
            font-size: 16px;
        }

        .status-box {
            margin-top: 20px;
            padding: 18px;
            border-radius: 10px;
            text-align: center;
            font-size: 18px;
            font-weight: bold;
        }

        .normal {
            background: #d4edda;
            color: #155724;
        }

        .warning {
            background: #fff3cd;
            color: #856404;
        }

        .critical {
            background: #f8d7da;
            color: #721c24;
        }

        .window-box {
            margin-top: 20px;
            background: #fafafa;
            border-radius: 10px;
            padding: 15px;
            font-size: 14px;
            line-height: 1.8;
            word-wrap: break-word;
            white-space: normal;
        }

        .chart-container {
            height: 500px;
            position: relative;
        }

        canvas {
            width: 100% !important;
            height: 100% !important;
        }

        @media(max-width: 1100px) {
            .container {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>

<div class="container">

    <div class="card">

        <h1>Temperature Anomaly Detector</h1>

        <button id="streamButton" class="start-btn" onclick="toggleStream()">
            Start Streaming
        </button>

        <div class="info-box">
            <p id="temp">Current Temperature: --</p>
            <p id="count">Collected Values: 0 / 30</p>
            <p id="anomaly">Anomaly Probability: --%</p>
        </div>

        <div id="statusBox" class="status-box">
            Waiting for streaming...
        </div>

        <div class="window-box">
            <strong>Rolling Temperature Window:</strong>
            <div id="windowData"></div>
        </div>

    </div>

    <div class="card">

        <h2>Live Temperature Monitoring Graph</h2>

        <div class="chart-container">
            <canvas id="tempChart"></canvas>
        </div>

    </div>

</div>

<script>

let intervalId = null;
let tempWindow = [];
let isStreaming = false;
let isPredicting = false;
let timeIndex = 0;

// ======================================
// Chart Initialization
// ======================================

const ctx = document.getElementById('tempChart').getContext('2d');

const tempChart = new Chart(ctx, {
    type: 'line',
    data: {
        labels: [],
        datasets: [
            {
                label: 'Temperature',
                data: [],
                borderColor: '#007bff',
                backgroundColor: '#007bff', // filled blue legend
                borderWidth: 3,
                tension: 0.35,
                fill: false,
                pointRadius: 3,
                pointHoverRadius: 6,
                pointStyle: 'circle'
            },
            {
                label: 'Critical Points',
                data: [],
                borderWidth: 0,
                pointBackgroundColor: '#ffffff', // hollow center
                pointBorderColor: '#dc3545',     // red border
                pointBorderWidth: 3,
                pointRadius: 8,
                pointHoverRadius: 10,
                showLine: false,
                pointStyle: 'circle'
            }
        ]
    },
    options: {
        responsive: true,
        maintainAspectRatio: false,
        animation: false,
        plugins: {
            legend: {
                display: true,
                position: 'top',
                 labels: {
                    usePointStyle: true,
                    pointStyle: 'circle',
                    padding: 20
                }
            },
            tooltip: {
                callbacks: {
                    label: function(context) {

                        if (context.dataset.label === 'Critical Points') {
                            return 'Critical Anomaly Detected';
                        }

                        return 'Temperature: ' + context.raw + '°C';
                    }
                }
            }
        },
        scales: {
            x: {
                title: {
                    display: true,
                    text: 'Time Sequence'
                }
            },
            y: {
                min: 0,
                max: 100,
                title: {
                    display: true,
                    text: 'Temperature (°C)'
                },
                ticks: {
                    stepSize: 10
                }
            }
        }
    }
});

// ======================================
// Update Graph
// ======================================

function updateChart(temp, isCritical) {

    tempChart.data.labels.push(timeIndex++);

    tempChart.data.datasets[0].data.push(temp);

    tempChart.data.datasets[1].data.push(
        isCritical ? temp : null
    );

    if (tempChart.data.labels.length > 100) {

        tempChart.data.labels.shift();
        tempChart.data.datasets[0].data.shift();
        tempChart.data.datasets[1].data.shift();
    }

    tempChart.update();
}

// ======================================
// Start / Stop Streaming
// ======================================

function toggleStream() {

    if (!isStreaming) {
        startStream();
    } else {
        stopStream();
    }
}

function startStream() {

    if (intervalId !== null) return;

    isStreaming = true;

    const button = document.getElementById('streamButton');

    button.innerText = 'Stop Streaming';
    button.className = 'stop-btn';

    document.getElementById('statusBox').innerText = 'Streaming Started';

    intervalId = setInterval(() => {

        let temp = parseFloat((Math.random() * 100).toFixed(2));

        tempWindow.push(temp);

        if (tempWindow.length > 30) {
            tempWindow.shift();
        }

        document.getElementById('temp').innerText =
            'Current Temperature: ' + temp + '°C';

        document.getElementById('count').innerText =
            'Collected Values: ' + tempWindow.length + ' / 30';

        updateWindowUI();

        if (tempWindow.length === 30) {
            sendPrediction();
        }

    }, 500);
}

function stopStream() {

    clearInterval(intervalId);
    intervalId = null;

    isStreaming = false;

    const button = document.getElementById('streamButton');

    button.innerText = 'Start Streaming';
    button.className = 'start-btn';

    document.getElementById('statusBox').innerText = 'Streaming Stopped';
}

// ======================================
// Prediction API
// ======================================

function sendPrediction() {

    if (isPredicting) return;
    if (tempWindow.length !== 30) return;

    isPredicting = true;

    fetch('/predict/', {
        method: 'POST',
        headers: {
            'Content-Type': 'application/json',
            'X-CSRFToken': getCookie('csrftoken')
        },
        body: JSON.stringify({
            sequence: tempWindow
        })
    })
    .then(response => response.json())
    .then(data => {

        let prob = parseFloat(data.probability || 0);

        document.getElementById('anomaly').innerText =
            'Anomaly Probability: ' + prob.toFixed(2) + '%';

        let status = 'Normal';

        const statusBox = document.getElementById('statusBox');

        statusBox.className = 'status-box';

        if (prob > 70) {

            status = 'Critical Alert';
            statusBox.classList.add('critical');
            statusBox.innerText =
                'Critical Alert (' + prob.toFixed(2) + '%)';
        }
        else if (prob > 50) {

            status = 'Warning';
            statusBox.classList.add('warning');
            statusBox.innerText =
                'Warning (' + prob.toFixed(2) + '%)';
        }
        else {

            statusBox.classList.add('normal');
            statusBox.innerText = 'Normal';
        }

        updateChart(
            tempWindow[tempWindow.length - 1],
            prob > 70
        );

    })
    .catch(error => {

        console.error('Prediction Error:', error);

        document.getElementById('statusBox').innerText =
            'Prediction Failed';
    })
    .finally(() => {

        isPredicting = false;
    });
}

// ======================================
// Rolling Window UI
// ======================================

function updateWindowUI() {

    const formatted = tempWindow
        .map(value => value.toFixed(2))
        .join(' ');

    document.getElementById('windowData').innerText = formatted;
}

// ======================================
// CSRF Cookie
// ======================================

function getCookie(name) {

    let cookieValue = null;

    if (document.cookie && document.cookie !== '') {

        const cookies = document.cookie.split(';');

        for (let i = 0; i < cookies.length; i++) {

            const cookie = cookies[i].trim();

            if (cookie.substring(0, name.length + 1) === (name + '=')) {

                cookieValue = decodeURIComponent(
                    cookie.substring(name.length + 1)
                );

                break;
            }
        }
    }

    return cookieValue;
}

</script>

</body>
</html>
